name: "PNPM setup"
author: "Arbeidstilsynet"
description: "Sets up Node.js and pnpm, optionally audits, and installs dependencies"

inputs:
  node-version:
    description: "Node.js version to use"
    default: "26.x"
    required: false
    deprecationMessage: "This action is deprecated. Use `pnpm/setup` instead and version Node.js with `devEngines` in `package.json`."
  working-directory:
    description: "Working directory containing package.json and pnpm-lock.yaml"
    default: "."
    required: false
    deprecationMessage: "This action is deprecated. Use `pnpm/setup` instead."
  skip-install:
    description: "Skip pnpm install step"
    default: "false"
    required: false
    deprecationMessage: "This action is deprecated. Use `pnpm/setup` instead."
  skip-audit:
    description: "Skip pnpm audit step; set to false to run pnpm audit"
    default: "true"
    required: false
    deprecationMessage: "This action is deprecated. Use `pnpm/setup` instead and run pnpm audit in your workflow."

runs:
  using: composite
  steps:
    - name: Deprecation warning
      shell: bash
      run: echo "::warning title=Arbeidstilsynet/action-pnpm-setup is deprecated::Migrate to pnpm/setup. See https://github.com/pnpm/setup"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: "${{ inputs.working-directory }}/package.json"
        cache: true

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "${{ inputs.node-version }}"
        registry-url: "https://registry.npmjs.org"

    - shell: bash
      run: pnpm --version
      working-directory: ${{ inputs.working-directory }}

    - shell: bash
      if: ${{ inputs.skip-audit != 'true' }}
      run: pnpm audit
      working-directory: ${{ inputs.working-directory }}

    - shell: bash
      if: ${{ inputs.skip-install != 'true' }}
      run: pnpm install
      working-directory: ${{ inputs.working-directory }}

    - name: "List packages"
      shell: bash
      if: ${{ inputs.skip-install != 'true' }}
      run: pnpm ls -r --depth 0
      working-directory: ${{ inputs.working-directory }}
